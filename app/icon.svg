<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="icon" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E4D7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="200" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Wallet body -->
  <rect x="108" y="160" width="260" height="210" rx="28" fill="url(#icon)"/>
  <!-- Wallet flap -->
  <path d="M108 210 C108 182 130 160 158 160 L340 160 C340 160 340 120 290 120 L158 120 C130 120 108 142 108 170 Z" fill="url(#icon)" opacity="0.7"/>
  <!-- Coin circle -->
  <circle cx="358" cy="268" r="52" fill="url(#accent)" stroke="#1E293B" stroke-width="8"/>
  <!-- Dollar sign on coin -->
  <text x="358" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">$</text>
  <!-- Sparkle dots -->
  <circle cx="160" cy="330" r="8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="200" cy="310" r="5" fill="#FFFFFF" opacity="0.2"/>
</svg>
